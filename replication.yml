paper:
  study_handle: rep-pnas
  materials: folder
  study_folder: rep-pnas-2026
  study_repo: replicate-anything/rep-pnas-2026
  study_ref: main
  title: "Digital literacy alters engagement with emotionally manipulative political content on social media"
  year: 2025
  authors: "Kristina Aleksandrovna Pedersen, Ferdinand Geissler, Felix Hartmann, Johannes Giesecke, Macartan Humphreys, Heike Klüver"
  dependencies:
    - tidyverse
    - scales
    - fixest
    - estimatr
    - broom
    - haven
    - knitr
    - ggrepel
    - ggh4x
    - ggalluvial

maintainer:
  name: Macartan Humphreys
  email: macartan.humphreys@wzb.eu

languages:
  - r

collections:
  - IPI

repo: replicate-anything/rep-pnas-2026

sidebar:
